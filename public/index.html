/* Modo de bajo consumo: sin mapa ni librería de mapas (?lite=1 lo activa, ?lite=0 lo desactiva) */
window.VAMO_LITE = (() => { try { const q = new URLSearchParams(location.search).get('lite'); if (q !== null) localStorage.setItem('vamo-lite', q === '0' ? '0' : '1'); return localStorage.getItem('vamo-lite') === '1'; } catch (e) { return /[?&]lite=1/.test(location.search); } })();
if (VAMO_LITE) document.documentElement.classList.add('lite');
else document.write('<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"><\/script>');
</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: panel de operación a la izquierda, mapa esquemático de la región a la derecha; en teléfono el mapa va arriba y el panel debajo. */
:root{
  /* Kit visual VAMO (tema claro, por defecto): fondos blancos, bordes suaves, color intenso solo en acciones y estados */
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F3F4F6; --ink:#1F2A44; --muted:#6B7280; --line:#E5E7EB;
  --ocean:#E8EEF7; --land:#F6F8FC; --road:#D1D5DB; --vine:#CDE5D3;
  --morado:#7B2FF7; --turquesa:#00C8FF; --fucsia:#FF007A; --violeta:#7B2FF7; --amarillo:#FFC107;
  --bus:#7B2FF7; --colectivo:#00A9DB; --taxi:#E0A100; --auto:#1F2A44; --moto:#FF7A00; --micro:#15924A;
  --accent:#7B2FF7; --accent-ink:#FFFFFF; --accent-t:#7B2FF7;
  --ok:#16A34A; --warn:#B7791F; --bad:#DC2626;
  --grad:linear-gradient(#7B2FF7,#7B2FF7);
  --glow:0 0 0 3px color-mix(in srgb,#7B2FF7 18%,transparent);
  --sombra:0 1px 2px rgba(31,42,68,.06),0 4px 14px rgba(31,42,68,.07);
  --glass:rgba(255,255,255,.94);
  --f-display:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B0F24; --surface:#11173A; --surface2:#161E48; --ink:#EEF2FF; --muted:#9AA3C7; --line:#28316A;
  --ocean:#0A1230; --land:#10173A; --road:#2A3366; --vine:#1E3A3A;
  --turquesa:#00E5FF; --fucsia:#FF00B8; --violeta:#8A2BE2; --amarillo:#FFC107;
  --moto:#B44CFF; --auto:#FF8A1F; --taxi:#FFC107; --bus:#2F8BFF; --colectivo:#00E5FF; --micro:#22C55E; --morado:#8A2BE2; --sombra:none; --accent:#00E5FF; --accent-ink:#0B0F24; --accent-t:#00E5FF;
  --ok:#22C55E; --warn:#FFC107; --bad:#FF4D6D;
  --grad:linear-gradient(90deg,#00E5FF 0%,#8A2BE2 55%,#FF00B8 100%);
  --glow:0 0 0 1px color-mix(in srgb,var(--accent) 60%,transparent),0 0 16px color-mix(in srgb,var(--accent) 35%,transparent);
  --glass:color-mix(in srgb,#0B0F24 82%,transparent);
  --f-display:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
.top{color:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,#070A1A,#0B0F24);border-bottom:2px solid transparent;border-image:var(--grad) 1;position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:12px}
.vamo-marca{display:flex;align-items:center;gap:6px}
.vamo-v{flex-shrink:0;display:block;filter:drop-shadow(0 0 8px rgba(0,229,255,.35))}
.vamo-palabra{display:grid;line-height:1;position:relative}
.vamo-nombre{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:23px;letter-spacing:.02em;color:#fff}
.vamo-swoosh{width:100%;height:6px;margin-top:1px}
.vamo-sello{font-size:10.5px;color:#C9D0EE;justify-self:end;margin-top:-1px}.vamo-sello b{color:#fff;font-weight:700}
.tagline{font-size:12.5px;color:#C9D0EE;margin-left:4px;padding-left:12px;border-left:1px solid #2A3366;display:flex;align-items:center;gap:6px}.tagline svg{color:var(--fucsia)}
/* Diseño pensado para teléfono: en pantallas grandes la app se muestra como un teléfono centrado */
.tagline{display:none}
.top label{font-size:12px;color:#9AA3C7}
.top select{padding:6px 8px;border:1px solid #2A3366;border-radius:10px;background:#11173A;color:#fff}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid #2A3366;background:#11173A;color:#fff;cursor:pointer}
.iconbtn:hover{box-shadow:var(--glow)}
.dbstate{font-size:11.5px;color:#9AA3C7;display:flex;align-items:center;gap:6px}
.dbstate::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dbstate[data-ok="1"]::before{background:var(--ok)}
.demo{margin-left:auto;font-size:11px;color:var(--amarillo);border:1px solid currentColor;border-radius:999px;padding:3px 10px;font-weight:700;letter-spacing:.04em;box-shadow:0 0 12px rgba(255,193,7,.25)}
.main{display:grid;grid-template-columns:minmax(330px,420px) 1fr;min-height:0}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line);background:var(--surface)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-left,0px)) 0;border-bottom:1px solid var(--line);flex-shrink:0}
.tab{border:0;background:none;padding:9px 10px 10px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab svg{width:16px;height:16px;flex-shrink:0}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}

.tab .ts{display:none}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tc,var(--accent))}
.tab[aria-selected="true"] svg{color:var(--tc,var(--accent));filter:drop-shadow(0 0 6px var(--tc,var(--accent)))}
.view{overflow-y:auto;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:14px;margin:0}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.field{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:8px}
.pin{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.pin.a{background:var(--turquesa);color:#0B0F24;box-shadow:0 0 10px rgba(0,229,255,.5)} .pin.b{background:var(--fucsia);color:#fff;box-shadow:0 0 10px rgba(255,0,184,.5)}
.field select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.field select.picking{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.hint{font-size:12px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--surface2);box-shadow:var(--glow)}
.opt .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.opt .t{font-weight:600}
.opt .d{font-size:12px;color:var(--muted)}
.opt .p{font-family:var(--f-mono);font-weight:500;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--grad);color:#fff;cursor:pointer;text-shadow:0 1px 2px rgba(11,15,36,.45);box-shadow:0 0 18px rgba(255,0,184,.25),0 0 18px rgba(0,229,255,.2)}
.btn.amarillo{background:var(--amarillo);color:#0B0F24;text-shadow:none;box-shadow:0 0 16px rgba(255,193,7,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);text-shadow:none;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.status{display:flex;gap:10px;align-items:flex-start}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.plate{font-family:var(--f-mono);border:1.5px solid var(--ink);border-radius:4px;padding:1px 6px;font-size:12px;letter-spacing:.04em;background:var(--surface)}
.list{display:flex;flex-direction:column;gap:6px}
.route{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.route[aria-pressed="true"]{border-color:var(--rc,var(--accent));box-shadow:inset 3px 0 0 var(--rc,var(--accent))}
.route .h{display:flex;gap:8px;align-items:center;justify-content:space-between}
.code{font-family:var(--f-mono);font-size:11.5px;font-weight:500;padding:2px 6px;border-radius:5px;color:#fff;background:var(--rc,var(--accent))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--surface2);cursor:pointer}
.chip.sel{border-color:var(--bus);color:var(--bus)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-t);background:var(--surface)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps span{height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--moto)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.offer{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.offer:hover{border-color:var(--accent)}
.offer .p{font-family:var(--f-mono);font-size:15px;font-weight:500}
.dlin{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.dlin input,.dlin select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.live{font-size:12px;display:flex;flex-direction:column;gap:4px}
.live div{display:flex;gap:6px;align-items:center}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:currentColor;background:transparent}
.tag.warn{color:var(--warn);border-color:currentColor;background:transparent}
.ticket{border:1px dashed var(--bus);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr 84px;gap:10px;background:var(--surface)}
.ticket canvas{width:84px;height:84px;image-rendering:pixelated;border-radius:4px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.stat .v{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--muted)}
.veh{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.switch{position:relative;width:40px;height:22px;border-radius:999px;border:0;background:var(--line);cursor:pointer;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{left:21px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form input,.form select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.form .full{grid-column:1/-1}
.form label{min-width:0}.form select,.form input{width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.best td{color:var(--ok);font-weight:600}
.mapwrap{position:relative;min-height:0;background:var(--ocean)}
#map{position:absolute;inset:0}
.stylebar{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:52px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 70px);z-index:2}
.stylebar button{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(6px);color:var(--ink);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.stylebar button[aria-pressed="true"]{background:var(--accent);color:#0B0F24;border-color:var(--accent);box-shadow:var(--glow)}
.search{position:relative}
.search input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink)}
.qres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:5;overflow:hidden}
.qres button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.qres button:hover,.qres button:focus-visible{background:var(--surface2)}
.note{margin:0;font-size:12.5px;color:var(--warn);border:1px solid currentColor;border-radius:8px;padding:8px 10px}
.btn.ghost[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-t)}
.maplibregl-ctrl-group button{color:#14232a}
.maplibregl-popup-content{border-radius:12px!important;padding:10px 12px!important}
.mapctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-size:16px}
.legend{z-index:2;position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:34px;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:11.5px;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 24px)}
.legend .lrow{display:flex;gap:12px;flex-wrap:wrap}
.legend img{width:13px;height:17px;display:block}
.legend .src{color:var(--muted);font-size:11px}
.legend span{display:flex;gap:5px;align-items:center}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.legend b{width:9px;height:9px;border-radius:50%;display:inline-block}
.clock{z-index:2;position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;background:var(--glass);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;display:flex;gap:8px;align-items:center}
svg text{font-family:var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:calc(var(--sw,0.01) * 1px);stroke-linejoin:round}
.filtros[hidden]{display:none}
.filtros{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:92px;display:flex;flex-wrap:wrap;gap:5px;z-index:2;max-width:calc(100% - 70px)}
.fchip{display:flex;align-items:center;gap:5px;border:1px solid color-mix(in srgb,var(--c) 70%,transparent);color:var(--ink);background:var(--glass);backdrop-filter:blur(6px);border-radius:999px;padding:4px 10px 4px 8px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 0 10px color-mix(in srgb,var(--c) 30%,transparent)}
.fchip svg{color:var(--c)}
.fchip[aria-pressed="false"]{opacity:.45;box-shadow:none;border-color:var(--line)}
.vchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--c);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;box-shadow:0 0 10px color-mix(in srgb,var(--c) 35%,transparent)}
.vchip svg{color:var(--c)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--c);color:var(--c);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.st.oficial{--c:var(--ok)} .st.estimado{--c:#C084FC} .st.sinhorario{--c:var(--muted)}
.st.disponible{--c:var(--ok)} .st.ocupado{--c:var(--muted)} .st.ruta{--c:var(--amarillo)} .st.vivo{--c:var(--fucsia)} .st.programado{--c:var(--bus)} .st.simulado{--c:var(--muted)} .st.comunidad{--c:var(--turquesa)}
.panel{background:linear-gradient(180deg,var(--surface),var(--bg))}
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
:root:not([data-theme="dark"]) .panel{background:var(--surface)}
@media all{
  .app{height:auto;min-height:100%}
  .main{display:flex;flex-direction:column}
  .mapwrap{height:52vh;min-height:300px;order:-1}
  .panel{border-right:0;min-width:0}
  .main{min-width:0;max-width:100vw}
  .top select{max-width:52vw}
  .view{overflow:visible}
  .demo{margin-left:0}
  .app{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;justify-content:space-around;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:blur(10px);border-top:1px solid var(--line);border-bottom:0;overflow:visible}
  .tab{flex:1;flex-direction:column;gap:3px;padding:4px 2px;font-size:10.5px;border-bottom:0;min-width:0}
  .tab svg{width:22px;height:22px}
  .tab .tl{display:none} .tab .ts{display:block}
  .tab[aria-selected="true"]{color:var(--tc,var(--accent))}
  .filtros{top:auto;bottom:12px;max-width:calc(100% - 24px)}
  .legend{display:none}
  .tagline{display:none}
  .top{gap:8px;padding-block:8px}
  .top label{display:none}
  .top select{max-width:44vw;padding:5px 6px}

    </section>
  </div>
</div>

<script>
/* ============ Geometría (proyección local en km) ============ */
const KX = 92.8, KY = 111, LON0 = -71.40, LAT0 = -33.30;
const P = ([lat, lon]) => [(lon - LON0) * KX, -(lat - LAT0) * KY];
const inv = (x, y) => [LAT0 - y / KY, LON0 + x / KX];
const off = (c, dx, dy) => [c[0] + dy / KY, c[1] + dx / KX];
const dist = (a, b) => { const [ax, ay] = P(a), [bx, by] = P(b); return Math.hypot(ax - bx, ay - by); };
const plen = pts => pts.slice(1).reduce((s, p, i) => s + dist(pts[i], p), 0);
function along(pts, f) { // punto a fracción f del recorrido
  const L = plen(pts) * Math.max(0, Math.min(1, f)); let acc = 0;
  for (let i = 1; i < pts.length; i++) { const d = dist(pts[i - 1], pts[i]);
    if (acc + d >= L) { const t = d ? (L - acc) / d : 0; return [pts[i-1][0] + (pts[i][0] - pts[i-1][0]) * t, pts[i-1][1] + (pts[i][1] - pts[i-1][1]) * t]; }
    acc += d; }
  return pts[pts.length - 1];
}
const clp = n => '$' + Math.round(n).toLocaleString('es-CL');
const hhmm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ============ Datos de ejemplo (multi-localidad) ============
   Coordenadas aproximadas. Recorridos, horarios y tarifas son de ejemplo, no oficiales. */
const N = {
  santiago: [-33.4489, -70.6693], curacavi: [-33.4038, -71.1336], lovasquez: [-33.327, -71.320],
  casablanca: [-33.3197, -71.4097], valparaiso: [-33.0472, -71.6127], vina: [-33.0245, -71.5518],
  quilpue: [-33.0479, -71.4425], algarrobo: [-33.3640, -71.6713], quintay: [-33.1925, -71.6990], lasdichas: [-33.272, -71.468]
};
const NOMBRES = { santiago: 'Santiago', curacavi: 'Curacaví', lovasquez: 'Lo Vásquez', casablanca: 'Casablanca', valparaiso: 'Valparaíso', vina: 'Viña del Mar', quilpue: 'Quilpué', algarrobo: 'Algarrobo', quintay: 'Quintay', lasdichas: 'Las Dichas' };

const LOCALIDADES = [
  { id: 'casablanca', nombre: 'Casablanca', estado: 'piloto', radio: 2.4, tarifa: { base: 900, km: 650, min: 110, minimo: 2500 } },
  { id: 'curacavi', nombre: 'Curacaví', estado: 'próximamente', radio: 1.6, tarifa: { base: 900, km: 650, min: 110, minimo: 2500 } },
  { id: 'valparaiso', nombre: 'Valparaíso', estado: 'próximamente', radio: 2.2, tarifa: { base: 1000, km: 700, min: 130, minimo: 2800 } },
  { id: 'vina', nombre: 'Viña del Mar', estado: 'próximamente', radio: 2.2, tarifa: { base: 1000, km: 700, min: 130, minimo: 2800 } },
  { id: 'quilpue', nombre: 'Quilpué', estado: 'próximamente', radio: 1.8, tarifa: { base: 950, km: 680, min: 120, minimo: 2600 } },
  { id: 'santiago', nombre: 'Santiago', estado: 'destino', radio: 3, tarifa: { base: 1100, km: 750, min: 140, minimo: 3000 } }
];
const LOC = Object.fromEntries(LOCALIDADES.map(l => [l.id, l]));

const CB = N.casablanca;
const POIS = [
  { id: 'cb-plaza', n: 'Plaza de Armas', loc: 'casablanca', c: CB },
  { id: 'cb-term', n: 'Terminal de buses', loc: 'casablanca', c: off(CB, 0.5, -0.2) },
  { id: 'cb-hosp', n: 'Hospital', loc: 'casablanca', c: off(CB, -0.6, 0.5) },
  { id: 'cb-liceo', n: 'Liceo', loc: 'casablanca', c: off(CB, -0.8, -0.5) },
  { id: 'cb-estadio', n: 'Estadio municipal', loc: 'casablanca', c: off(CB, 0.9, 0.8) },
  { id: 'cb-norte', n: 'Sector Norte', loc: 'casablanca', c: off(CB, -0.3, 1.6) },
  { id: 'cb-sur', n: 'Sector Sur', loc: 'casablanca', c: off(CB, 0.2, -1.4) },
  { id: 'cb-r68', n: 'Acceso Ruta 68', loc: 'casablanca', c: off(CB, 1.6, -0.9) },
  { id: 'cb-quintay', n: 'Caleta Quintay', loc: 'casablanca', c: N.quintay },
  { id: 'cb-dichas', n: 'Las Dichas', loc: 'casablanca', c: N.lasdichas },
  { id: 'cu-plaza', n: 'Plaza de Curacaví', loc: 'curacavi', c: N.curacavi },
  { id: 'cu-term', n: 'Paradero Ruta 68 Curacaví', loc: 'curacavi', c: off(N.curacavi, 0.4, 0.5) },
  { id: 'va-term', n: 'Terminal Rodoviario Valparaíso', loc: 'valparaiso', c: N.valparaiso },
  { id: 'va-centro', n: 'Plaza Sotomayor', loc: 'valparaiso', c: off(N.valparaiso, 1.0, 0.6) },
  { id: 'vi-term', n: 'Terminal de Viña', loc: 'vina', c: N.vina },
  { id: 'vi-centro', n: 'Centro de Viña', loc: 'vina', c: off(N.vina, -0.6, 0.4) },
  { id: 'qu-centro', n: 'Centro de Quilpué', loc: 'quilpue', c: N.quilpue },
  { id: 'qu-est', n: 'Estación Quilpué', loc: 'quilpue', c: off(N.quilpue, 0.5, -0.3) },
  { id: 'st-sur', n: 'Terminal Sur (Estación Central)', loc: 'santiago', c: [-33.4540, -70.6870] },
  { id: 'st-paj', n: 'Terminal Pajaritos', loc: 'santiago', c: [-33.4565, -70.7425] },
  { id: 'st-air', n: 'Aeropuerto de Santiago (SCL)', loc: 'santiago', c: [-33.3930, -70.7858] }
];
const POI = Object.fromEntries(POIS.map(p => [p.id, p]));

const SEG = {
  stgo_cb: [[-33.4540, -70.6870], [-33.4565, -70.7425], [-33.47, -70.80], [-33.43, -70.98], N.curacavi, [-33.38, -71.24], N.lovasquez, CB],
  cb_valpo: [CB, [-33.25, -71.47], [-33.15, -71.55], [-33.09, -71.59], N.valparaiso],
  cb_vina: [CB, [-33.25, -71.47], [-33.15, -71.55], [-33.09, -71.59], [-33.06, -71.565], N.vina],
  cb_alg: [CB, [-33.34, -71.50], [-33.37, -71.60], N.algarrobo],
  cb_quintay: [CB, [-33.28, -71.50], [-33.24, -71.60], N.quintay],
  cb_quil: [CB, [-33.26, -71.43], [-33.16, -71.43], [-33.09, -71.45], N.quilpue],
  cb_dichas: [CB, [-33.29, -71.44], N.lasdichas],
  vina_quil: [N.vina, [-33.04, -71.50], N.quilpue],
  valpo_vina: [N.valparaiso, [-33.035, -71.58], N.vina],
  aeropuerto: [[-33.47, -70.80], [-33.43, -70.80], [-33.3930, -70.7858]]
};
const ROADS = Object.values(SEG);

let INTER = [ // respaldo local: la app usa la base de datos (recorrido_publico) cuando hay conexión
  { id: 'I1', nombre: 'Casablanca – Valparaíso', path: SEG.cb_valpo, paradas: ['cb-term', 'va-term'], min: 40, precio: 1800, cada: 20, primero: 360, ultimo: 1320, op: 'Operador de ejemplo A' },
  { id: 'I2', nombre: 'Casablanca – Viña del Mar', path: SEG.cb_vina, paradas: ['cb-term', 'vi-term'], min: 45, precio: 1900, cada: 30, primero: 370, ultimo: 1300, op: 'Operador de ejemplo A' },
  { id: 'I3', nombre: 'Casablanca – Santiago (Pajaritos y Terminal Sur)', path: [...SEG.stgo_cb].reverse(), paradas: ['cb-term', 'cu-term', 'st-paj', 'st-sur'], min: 75, precio: 3800, cada: 30, primero: 330, ultimo: 1290, op: 'Operador de ejemplo B' },
  { id: 'I4', nombre: 'Curacaví – Valparaíso', path: [...SEG.stgo_cb.slice(3), ...SEG.cb_valpo.slice(1)], paradas: ['cu-term', 'cb-term', 'va-term'], min: 70, precio: 2800, cada: 60, primero: 390, ultimo: 1260, op: 'Operador de ejemplo B' },
  { id: 'I5', nombre: 'Casablanca – Algarrobo', path: SEG.cb_alg, paradas: ['cb-term'], extra: 'Algarrobo', min: 40, precio: 1700, cada: 45, primero: 400, ultimo: 1230, op: 'Operador de ejemplo C' },
  { id: 'I6', nombre: 'Casablanca – Quilpué', path: SEG.cb_quil, paradas: ['cb-term', 'qu-centro'], min: 50, precio: 2000, cada: 60, primero: 420, ultimo: 1200, op: 'Operador de ejemplo C' },
  { id: 'I8', nombre: 'Casablanca – Aeropuerto de Santiago', path: [...[...SEG.stgo_cb].reverse().slice(0, 6), ...SEG.aeropuerto.slice(1)], paradas: ['cb-term', 'cu-term', 'st-air'], min: 75, precio: 7500, cada: 120, primero: 300, ultimo: 1260, op: 'Operador de ejemplo E' },
  { id: 'I7', nombre: 'Viña del Mar – Quilpué', path: SEG.vina_quil, paradas: ['vi-term', 'qu-centro'], min: 30, precio: 900, cada: 15, primero: 360, ultimo: 1380, op: 'Operador de ejemplo D' }
];
const pc = id => POI[id].c;
// Micros desactivadas por decisión del usuario (18-11-2026). Los datos no se borran; basta poner true para volver a mostrarlas.
const MICROS_ACTIVAS = false;
let MICROS = [
  { id: 'L1', nombre: 'Línea 1 · Norte – Sur', loc: 'casablanca', tipo: 'urbana', path: ['cb-norte', 'cb-hosp', 'cb-plaza', 'cb-term', 'cb-sur'].map(pc), paradas: ['cb-norte', 'cb-hosp', 'cb-plaza', 'cb-term', 'cb-sur'], min: 14, precio: 500, cada: 12, primero: 400, ultimo: 1290 },
  { id: 'L2', nombre: 'Línea 2 · Circunvalación', loc: 'casablanca', tipo: 'urbana', path: ['cb-plaza', 'cb-liceo', 'cb-sur', 'cb-r68', 'cb-estadio', 'cb-norte', 'cb-hosp', 'cb-plaza'].map(pc), paradas: ['cb-plaza', 'cb-liceo', 'cb-sur', 'cb-r68', 'cb-estadio', 'cb-norte', 'cb-hosp'], min: 22, precio: 500, cada: 20, primero: 410, ultimo: 1260 },
  { id: 'R1', nombre: 'Rural · Casablanca – Quintay', loc: 'casablanca', tipo: 'rural', path: SEG.cb_quintay, paradas: ['cb-plaza', 'cb-quintay'], min: 35, precio: 1200, cada: 90, primero: 420, ultimo: 1200 },
  { id: 'R2', nombre: 'Rural · Casablanca – Las Dichas', loc: 'casablanca', tipo: 'rural', path: SEG.cb_dichas, paradas: ['cb-plaza', 'cb-dichas'], min: 20, precio: 900, cada: 120, primero: 430, ultimo: 1150 }
];
let ALLROUTES = [];
let RUTAS_FUENTE = 'local';
function buildRoutes() { if (!MICROS_ACTIVAS) MICROS = []; for (const r of [...INTER, ...MICROS]) { r.th = r.th || 'programado'; r.fuente = r.fuente || 'Horario de ejemplo (no oficial)'; r.ejemplo = /ejemplo/i.test(r.fuente + ' ' + (r.op || '')); }
  ALLROUTES = [...INTER.map(r => ({ ...r, kind: 'bus' })), ...MICROS.map(r => ({ ...r, kind: 'micro' }))]; }
buildRoutes();
// Origen del horario: oficial (operador), programado (Fluva), estimado (calculado), sin_horario
const TH = { oficial: ['Horario oficial', 'oficial'], programado: ['Programado', 'programado'], estimado: ['Estimado', 'estimado'], sin_horario: ['Sin horario confirmado', 'sinhorario'] };
const thBadge = r => `<span class="st ${TH[r.th || 'programado'][1]}">${TH[r.th || 'programado'][0]}</span>`;
const SIN_EST = 'Sin estimación disponible';
const routeLocs = r => [...new Set(r.paradas.map(p => POI[p].loc))];

/* ============ Horarios y posición en vivo (derivada del horario) ============ */
function departures(r) { const out = []; if (!r.cada || r.primero == null) return out; for (let t = r.primero; t <= r.ultimo; t += r.cada) out.push(t); return out; }
function nextDeps(r, n = 5) { const t = nowMin(); return departures(r).filter(d => d >= t - 0.5).slice(0, n); }
function activeTrips(r) { // ida y vuelta
  const t = nowMin(), out = [];
  for (const d of departures(r)) {
    for (const dir of [1, -1]) { const dep = dir === 1 ? d : d + r.cada / 2;
      if (t >= dep && t <= dep + r.min) { const f = (t - dep) / r.min; out.push({ r, dep, dir, f, pos: along(dir === 1 ? r.path : [...r.path].reverse(), f), eta: dep + r.min }); } }
  }
  return out;
}
const PLACES = Object.entries(N).map(([k, c]) => ({ n: NOMBRES[k], c })).concat(POIS.map(p => ({ n: p.n, c: p.c })));
const nearPlace = c => PLACES.reduce((b, p) => { const d = dist(p.c, c); return d < b.d ? { n: p.n, d } : b; }, { n: '', d: 1e9 });

/* ============ Flota de autos (simulada) ============ */
const NOMBRES_COND = ['Carolina', 'Jorge', 'Paula', 'Luis', 'Camila', 'Héctor', 'Daniela', 'Rodrigo', 'Fernanda', 'Pedro', 'Valentina', 'Mauricio'];
const LET = 'BCDFGHJKLPRSTVWXYZ';
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const plate = () => Array.from({ length: 4 }, () => LET[Math.floor(rnd() * LET.length)]).join('') + '·' + String(10 + Math.floor(rnd() * 89));
function randIn(locId) { const c = N[locId], R = LOC[locId].radio; const a = rnd() * 6.283, r = Math.sqrt(rnd()) * R; return off(c, Math.cos(a) * r, Math.sin(a) * r); }
const FLEET = [];
const TAXI_MOD = ['Toyota Corolla', 'Nissan Sentra', 'Hyundai Elantra', 'Chevrolet Cruze'];
for (const l of LOCALIDADES) { const n = l.id === 'casablanca' ? 9 : 4, nt = l.id === 'casablanca' ? 5 : 2;
  for (let i = 0; i < nt; i++) FLEET.push({ id: l.id + 't' + i, tipo: 'taxi', loc: l.id, pos: randIn(l.id), tgt: randIn(l.id), estado: rnd() < 0.3 ? 'ocupado' : 'libre', patente: plate(), cond: NOMBRES_COND[Math.floor(rnd() * NOMBRES_COND.length)], modelo: TAXI_MOD[Math.floor(rnd() * 4)], nota: (4.6 + rnd() * 0.4).toFixed(1) });
  for (let i = 0; i < n; i++) FLEET.push({ id: l.id + i, tipo: 'auto', loc: l.id, pos: randIn(l.id), tgt: randIn(l.id), estado: rnd() < 0.3 ? 'ocupado' : 'libre', patente: plate(), cond: NOMBRES_COND[Math.floor(rnd() * NOMBRES_COND.length)], modelo: ['Toyota Yaris', 'Chevrolet Sail', 'Kia Rio', 'Suzuki Swift', 'Hyundai Accent'][Math.floor(rnd() * 5)], nota: (4.6 + rnd() * 0.4).toFixed(1) }); }
const MOTO_MOD = ['Honda CB 125', 'Yamaha YBR 125', 'Suzuki GN 125', 'Bajaj Pulsar 135'];
for (const l of LOCALIDADES) if (l.id !== 'santiago') for (let i = 0; i < (l.id === 'casablanca' ? 6 : 2); i++)
  FLEET.push({ id: l.id + 'm' + i, tipo: 'moto', loc: l.id, pos: randIn(l.id), tgt: randIn(l.id), estado: rnd() < 0.25 ? 'ocupado' : 'libre', patente: plate(), cond: NOMBRES_COND[Math.floor(rnd() * NOMBRES_COND.length)], modelo: MOTO_MOD[Math.floor(rnd() * 4)], nota: (4.6 + rnd() * 0.4).toFixed(1) });
for (const v of FLEET) v.fx = 0.85 + rnd() * 0.4; // cada conductor fija su propio precio (más barato o más caro que la referencia)
const SIM = 8; // velocidad de simulación para autos

/* ============ Dueños de vehículos (demo) ============ */
const PLANES = [
  { id: 'viaje', n: 'Por viaje', d: '8 % de cada viaje cobrado', calc: (v, t) => v * t * 0.08 },
  { id: 'dia', n: 'Por día conectado', d: '$3.500 por día que te conectas', calc: () => 3500 },
  { id: 'hora', n: 'Por hora en línea', d: '$450 por hora disponible', calc: (v, t, h) => h * 450 }
];
let OWNER = { plan: 'viaje', vehiculos: [
  { id: 'o1', tipo: 'auto', modelo: 'Toyota Corolla 2019', patente: 'KXRT·45', servicio: 'viajes', activo: true, cond: 'Tú' },
  { id: 'o2', tipo: 'van', modelo: 'Hyundai H-1 2017', patente: 'JPLW·12', servicio: 'rural', activo: false, cond: 'Conductor asignado' },
  { id: 'o3', tipo: 'auto', modelo: 'Nissan Sentra 2020', patente: 'TXCB·27', servicio: 'taxi', activo: true, cond: 'Conductor asignado' }
], tarifa: { base: 800, km: 600, minimo: 2500 }, viajes: [
  { h: '08:12', r: 'Plaza de Armas → Terminal de buses', m: 2800 },
  { h: '09:40', r: 'Hospital → Acceso Ruta 68', m: 3900 },
  { h: '11:05', r: 'Sector Sur → Plaza de Armas', m: 3100 },
  { h: '12:30', r: 'Casablanca → Caleta Quintay', m: 21500 }
] };
try { const s = JSON.parse(localStorage.getItem('trayecto-owner-v2') || 'null'); if (s && s.vehiculos) OWNER = s; } catch (e) {}
if (!OWNER.tarifa) OWNER.tarifa = { base: 800, km: 600, minimo: 2500 };
const saveOwner = () => { try { localStorage.setItem('trayecto-owner-v2', JSON.stringify(OWNER)); } catch (e) {} };
function syncOwnerFleet() {
  for (let i = FLEET.length - 1; i >= 0; i--) if (FLEET[i].owned) FLEET.splice(i, 1);
  for (const v of OWNER.vehiculos) if (v.activo && (!v.verif || v.verif === 'verificado' || !['taxi', 'colectivo', 'interurbano'].includes(v.servicio)) && (v.servicio === 'viajes' || v.servicio === 'taxi' || v.servicio === 'delivery')) FLEET.push({ id: 'own-' + v.id, owned: true, fx: 1, tipo: v.servicio === 'taxi' ? 'taxi' : v.tipo === 'moto' ? 'moto' : 'auto', loc: 'casablanca', pos: randIn('casablanca'), tgt: randIn('casablanca'), estado: 'libre', patente: v.patente, cond: v.cond, modelo: v.modelo, nota: '5.0' });
}
syncOwnerFleet();

/* ============ Tarifas (ejemplo) ============ */

// Etapa 6: el dueño configura una vez (conductores, pausa, horarios, tarifas, asientos, salidas)
async function cargarGestion(v) { const id = v.rid; if (FL.gest[id] === 0) return; FL.gest[id] = 0; const ahora = new Date().toISOString();
  try { const [cond, inv, hor, cats, tars, sal] = await Promise.all([FLOTA.pedir(`conductor_vehiculo?select=*&vehiculo_id=eq.${id}&order=creado_en`),
      FLOTA.pedir(`invitacion?select=*&vehiculo_id=eq.${id}&usada_por=is.null&vence=gt.${ahora}`), FLOTA.pedir(`horario?select=*&vehiculo_id=eq.${id}&order=salida`),
      FLOTA.pedir(`categoria_asiento?select=*&vehiculo_id=eq.${id}&order=id`), FLOTA.pedir(`tarifa_servicio?select=*&vehiculo_id=eq.${id}&order=id`),
      FLOTA.pedir(`salida_programada?select=*&vehiculo_id=eq.${id}&sale_en=gte.${ahora}&order=sale_en&limit=20`)]);
    FL.gest[id] = { cond, inv, hor, cats, tars, sal };
  } catch (e) { FL.gest[id] = undefined; flMsg(traducir(e), false); return; } rerender(); }
const recargarGestion = () => { const v = vSel(); if (v && v.rid) { delete FL.gest[v.rid]; rerender(); } };
async function gestionar(p, ok) { try { await p; if (ok) FL.msg = { t: ok, ok: true, at: Date.now() }; } catch (e) { FL.msg = { t: traducir(e), ok: false, at: Date.now() }; } recargarGestion(); }

  if (b.id === 'pGpsStop') { const s = SES[v.id]; gpsDetener(); if (s && s.rsid) { s.gpsOk = false; saveSes(); remoto('detener_ubicacion', { s: s.rsid }, 'Dejaste de compartir tu ubicación.').catch(() => {}); } rerender(); return; }

  if (b.id === 'invOk') { const c = (document.getElementById('invCod') || {}).value || ''; if (!c.trim()) return;
    try { const rid = await FLOTA.rpc('aceptar_invitacion', { c }); await sincronizar(true); const x = OWNER.vehiculos.find(y => y.rid === rid); if (x) S.panelVid = x.id; FL.msg = { t: 'Listo: ya puedes conducir este vehículo.', ok: true, at: Date.now() }; ir('panelcond'); } catch (err) { flMsg(traducir(err), false); } return; }

/* Planificador multimodal */
function planOptions() {
  const o = POI[S.plan.o], d = POI[S.plan.d]; if (!o || !d || o.id === d.id) return [];
  const out = [], q = quote(o.c, d.c, o.loc);
  out.push({ n: 'Auto directo', ic: 'A', color: 'var(--auto)', precio: q.precio, mins: q.mins, legs: [{ t: `Auto de ${o.n} a ${d.n}`, line: [o.c, d.c], color: 'var(--auto)', dash: '6 4' }] });
  const t = nowMin();
  if (o.loc === d.loc) {
    for (const m of RV(MICROS).filter(m => m.loc === o.loc)) { const so = m.paradas.map(p => POI[p]).sort((a, b) => dist(a.c, o.c) - dist(b.c, o.c))[0], sd = m.paradas.map(p => POI[p]).sort((a, b) => dist(a.c, d.c) - dist(b.c, d.c))[0];
      if (so.id === sd.id || dist(so.c, o.c) > 0.9 || dist(sd.c, d.c) > 0.9) continue;
      const dep = nextDeps(m, 1)[0]; if (dep == null) continue; const walk = (dist(so.c, o.c) + dist(sd.c, d.c)) * 1.3 / 4.5 * 60;

  else if (b.dataset.dlver) { const p = DL.find(x => x.id === b.dataset.dlver); S.dl.sel = p.id; S.dl.follow = p.id; render(); map.flyTo({ center: ll(p.car.pos), zoom: 15.5, duration: 900 }); }

/* ============ Simulación ============ */
function startRide() {
  const o = placeOf(S.o), d = placeOf(S.d), c = CLASES.find(c => c.id === S.clase), q = quote(o.c, d.c, o.loc, c.f);
  const modo = c.f === 'taxi' ? 'taxi' : modoPrecio(o.loc, 'viaje');
  const precio = modo === 'rango' ? r100(rangoPrecio(o.loc, 'viaje', q.km, q.precio).med * c.f) : q.precio;
  S.ride = { fase: 'buscando', modo, clase: c.id, precio, km: q.km, loc: o.loc, o: o.c, d: d.c }; S.note = ''; render();
  setTimeout(() => { const R = S.ride; if (!R || R.fase !== 'buscando') return; const cand = nearbyCars(o.c, modo === 'conductor' ? 3 : 1, c.tipo);
    if (!cand.length) { S.ride = null; S.note = `No hay ${c.tipo === 'taxi' ? 'taxis' : 'autos'} libres cerca en este momento. Prueba otra opción.`; render(); return; }
    if (modo === 'conductor') { R.fase = 'ofertas'; R.ofertas = cand.map(x => ({ v: x.v, eta: Math.max(1, Math.round(x.d * 1.3 / 30 * 60)), precio: precioConductor(x.v, q.precio, q.km, c.f) })).sort((a, b) => a.precio - b.precio); render(); return; }
    assignRide(R, cand[0].v); }, 1400);
}
async function assignRide(R, car) {
  if (car.estado !== 'libre' || car.job) { S.note = 'Ese conductor acaba de tomar otro viaje. Elige otra oferta.'; R.ofertas = (R.ofertas || []).filter(o => o.v !== car); if (!R.ofertas.length) S.ride = null; render(); return; }
  R.car = car; car.estado = 'asignado'; R.fase = 'va'; R.leg = [car.pos, R.o]; R.legKm = dist(car.pos, R.o) * 1.3; R.f = 0; S.note = ''; render();
  if (!S.follow) fit([car.pos, R.o], 0.5);
  const rt = await directions(car.pos, R.o); if (rt && S.ride === R && R.fase === 'va' && R.f < 0.05) { R.leg = rt.coords; R.legKm = rt.km; R.f = 0; } }
function stepRide(dt) { const R = S.ride; if (!R || !R.car || !['va', 'viaje'].includes(R.fase)) return;
  const kmh = R.legKm > 12 ? 70 : 30, boost = R.legKm > 40 ? 4 : 1; R.f += (kmh * SIM * boost / 3600 * dt) / Math.max(0.05, R.legKm);
  R.car.pos = along(R.leg, R.f); const rem = Math.max(0, (1 - R.f) * R.legKm / kmh * 60);
  const eta = document.getElementById('rideEta'); if (eta) eta.textContent = (R.fase === 'va' ? 'Llega a A en ' : 'Llegas a B en ') + Math.max(1, Math.ceil(rem)) + ' min · ' + ((1 - Math.min(1, R.f)) * R.legKm).toFixed(1) + ' km';
  if (S.followCar && R.car) map.jumpTo({ center: ll(R.car.pos) });
  if (R.f >= 1) { if (R.fase === 'va') { R.fase = 'llego'; render(); setTimeout(() => { if (S.ride === R) { R.fase = 'viaje'; const rt = cached(R.o, R.d); R.leg = rt ? rt.coords : [R.o, R.d]; R.legKm = rt ? rt.km : dist(R.o, R.d) * 1.3; R.f = 0; R.car.estado = 'ocupado'; render(); } }, 1500); }
    else { R.fase = 'fin'; R.car.estado = 'libre'; R.car.tgt = randIn(R.car.loc); S.followCar = false; if (R.modo !== 'taxi') registrarPagado(R.loc, 'viaje', R.km, R.precio);
      HIST.unshift({ f: Date.now(), o: (placeOf(S.o) || {}).n || 'Origen', d: (placeOf(S.d) || {}).n || 'Destino', clase: (CLASES.find(c => c.id === R.clase) || {}).n || R.clase, precio: R.precio }); saveMis(); render(); } } }
function stepFleet(dt) { for (const v of FLEET) { if (v.job || (S.ride && S.ride.car === v && S.ride.fase !== 'fin')) continue;
  const dk = dist(v.pos, v.tgt), mv = 28 * SIM / 3600 * dt; if (dk < mv) { v.tgt = randIn(v.loc); if (!v.owned && rnd() < 0.25) v.estado = v.estado === 'libre' ? 'ocupado' : 'libre'; } else v.pos = along([v.pos, v.tgt], mv / dk); } }
function followTick(force) { if (!S.follow) return; const r = ALLROUTES.find(r => r.id === S.follow.id); const tr = activeTrips(r).find(t => t.dep === S.follow.dep && t.dir === S.follow.dir);
  if (!tr) { S.follow = null; return; } if (force) map.flyTo({ center: ll(tr.pos), zoom: 14, duration: 1000 }); else map.jumpTo({ center: ll(tr.pos) }); }
map.on('dragstart', () => { S.follow = null; S.followCar = false; S.dl.follow = null; });
let last = performance.now(), acc = 0, liveAcc = 0;
function loop(now) { const dt = Math.min(0.25, (now - last) / 1000); last = now; acc += dt; liveAcc += dt;
  stepFleet(dt); stepRide(dt); stepDelivery(dt);
  if (acc > 0.12) { acc = 0; drawOver(); if (S.follow) followTick(false); }
  if (liveAcc > 2) { liveAcc = 0; document.getElementById('clk').textContent = hhmm(nowMin());
    document.querySelectorAll('[data-live]').forEach(n => { n.innerHTML = busLiveRows(ALLROUTES.find(r => r.id === n.dataset.live)); });
    document.querySelectorAll('[data-dleta]').forEach(n => { const p = DL.find(x => x.id === n.dataset.dleta); if (p) n.textContent = dlEta(p); });
    const nl = document.getElementById('nearList'); if (nl && !S.ride) { const o = placeOf(S.o); nl.innerHTML = nearHTML(o); const nb = document.getElementById('nLibres'); if (nb) nb.textContent = libresTxt(o); } }

const SB_URL = FLOTA.on ? FLOTA.URL : 'https://yktziqqggiyhasifvvdb.supabase.co', SB_KEY = FLOTA.on ? FLOTA.KEY : 'sb_publishable_M6szJFH4KE_d-rWSLf28Gg_RAUefnJW';
async function sb(path) { const r = await fetch(`${SB_URL}/rest/v1/${path}`, { headers: { apikey: SB_KEY } }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }

    el.textContent = `Base de datos conectada · ${locs.length} localidades${RUTAS_FUENTE === 'bd' ? ' · ' + ALLROUTES.length + ' recorridos' : ''}`; el.dataset.ok = '1'; const y = view.scrollTop; render(); view.scrollTop = y;
  } catch (e) { el.textContent = 'Sin conexión a la base de datos, usando datos locales'; } }
const aMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
async function cargarRecorridos() {
  const [lugares, rutas] = await Promise.all([sb('lugar_publico?select=id,localidad_id,nombre,tipo,lat,lon'), sb('recorrido_publico?select=*&order=orden')]);
  for (const l of lugares) { if (!LOC[l.localidad_id]) continue; const c = [l.lat, l.lon];
    if (POI[l.id]) { POI[l.id].c = c; POI[l.id].n = l.nombre; } else { const p = { id: l.id, n: l.nombre, loc: l.localidad_id, c }; POIS.push(p); POI[l.id] = p; } }
